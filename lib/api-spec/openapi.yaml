openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Source-grounded personal study notebook
servers:
  - url: /api
paths:
  /courses:
    get:
      operationId: listCourses
      responses:
        "200":
          description: Private courses
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Course" } }
    post:
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
  /courses/{id}:
    patch:
      operationId: updateCourse
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseUpdate" }
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
    delete:
      operationId: deleteCourse
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204":
          description: Course and all associated data permanently deleted
  /courses/{id}/activate:
    post:
      operationId: activateCourse
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Active course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
  /courses/{id}/uploads:
    post:
      operationId: uploadCourseFile
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CourseFileInput" }
      responses:
        "201":
          description: Extracted and saved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
  /practice:
    post:
      operationId: generatePractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeInput" }
      responses:
        "200":
          description: AI-generated source-grounded problems
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ExamQuestion" } }
  /backup:
    get:
      operationId: downloadBackup
      responses:
        "200":
          description: Complete account JSON backup
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /notebook:
    get:
      operationId: getNotebook
      responses:
        "200":
          description: Notebook and real summary counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notebook" }
  /sources/{id}:
    get:
      operationId: getSource
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Source pages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
  /messages:
    get:
      operationId: listMessages
      responses:
        "200":
          description: Saved conversation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "200":
          description: Tutor response and number extracted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorReply" }
  /items:
    get:
      operationId: listItems
      parameters:
        - { name: status, in: query, required: true, schema: { type: string, enum: [pending, approved] } }
      responses:
        "200":
          description: Review queue or flashcard library
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudyItem" }
  /items/{id}:
    patch:
      operationId: updateItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemUpdate" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyItem" }
  /exams:
    get:
      operationId: listExams
      responses:
        "200":
          description: Notebook exam history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExamSummary" }
    post:
      operationId: createExamAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamInput" }
      responses:
        "201":
          description: Frozen exam attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamAttempt" }
        "409":
          $ref: "#/components/responses/ExamConflict"
        "400":
          $ref: "#/components/responses/ExamInvalid"
        "404":
          $ref: "#/components/responses/ExamNotFound"
  /exams/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getExamAttempt
      responses:
        "200":
          description: Frozen exam and saved progress or results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamAttempt" }
        "404":
          $ref: "#/components/responses/ExamNotFound"
        "400":
          $ref: "#/components/responses/ExamInvalid"
    patch:
      operationId: updateExamAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamProgress" }
      responses:
        "200":
          description: Saved progress or server-scored final result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamAttempt" }
        "400":
          $ref: "#/components/responses/ExamInvalid"
        "404":
          $ref: "#/components/responses/ExamNotFound"
        "409":
          $ref: "#/components/responses/ExamConflict"
components:
  responses:
    ExamInvalid:
      description: Invalid exam input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExamError" }
    ExamNotFound:
      description: Exam not found in this notebook
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExamError" }
    ExamConflict:
      description: An unfinished exam exists, or the attempt changed in another tab
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExamError" }
  schemas:
    CourseInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
    CourseFileInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    CourseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        isPinned: { type: boolean }
    PracticeInput:
      type: object
      required: [sourceIds, count]
      properties:
        sourceIds: { type: array, minItems: 1, maxItems: 20, items: { type: integer } }
        count: { type: integer, minimum: 1, maximum: 12 }
    Course:
      type: object
      required: [id, title, description, active, sourceCount, isPinned]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        isPinned: { type: boolean }
        active: { type: boolean }
        sourceCount: { type: integer }
    ExamError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ExamQuestion:
      type: object
      required: [id, kind, category, sourceId, prompt, choices, correctIndex, explanation, citations]
      properties:
        id: { type: string }
        kind: { type: string, enum: [terminology, applied] }
        category: { type: string }
        sourceId: { type: integer }
        prompt: { type: string }
        choices:
          type: array
          items: { type: string }
        correctIndex: { type: integer }
        explanation: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
    ExamScore:
      type: object
      required: [correct, total, unanswered, percent]
      properties:
        correct: { type: integer }
        total: { type: integer }
        unanswered: { type: integer }
        percent: { type: number }
    ExamSummary:
      type: object
      required: [id, status, sourceIds, requestedCount, total, answered, currentIndex, version, score, createdAt, updatedAt, completedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [in_progress, completed, abandoned] }
        sourceIds:
          type: array
          items: { type: integer }
        requestedCount: { type: integer }
        total: { type: integer }
        answered: { type: integer }
        currentIndex: { type: integer }
        version: { type: integer }
        score:
          oneOf:
            - { $ref: "#/components/schemas/ExamScore" }
            - { type: "null" }
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt: { type: [string, "null"] }
    ExamAttempt:
      allOf:
        - { $ref: "#/components/schemas/ExamSummary" }
        - type: object
          required: [questions, answers]
          properties:
            questions:
              type: array
              items: { $ref: "#/components/schemas/ExamQuestion" }
            answers:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
    ExamInput:
      type: object
      required: [sourceIds, requestedCount]
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, minimum: 1 }
        requestedCount: { type: integer, enum: [6, 10, 15, 20] }
        retryOf: { type: integer, minimum: 1 }
    ExamProgress:
      type: object
      required: [version, answers, currentIndex, action]
      properties:
        version: { type: integer, minimum: 0 }
        answers:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        currentIndex: { type: integer, minimum: 0 }
        action: { type: string, enum: [save, submit, abandon] }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Source:
      type: object
      required: [id, title, lecture, pageCount, description]
      properties:
        id: { type: integer }
        title: { type: string }
        lecture: { type: string }
        pageCount: { type: integer }
        description: { type: string }
    SourcePage:
      type: object
      required: [page, text]
      properties:
        page: { type: integer }
        text: { type: string }
    SourceDetail:
      allOf:
        - { $ref: "#/components/schemas/Source" }
        - type: object
          required: [pages]
          properties:
            pages:
              type: array
              items: { $ref: "#/components/schemas/SourcePage" }
    Citation:
      type: object
      required: [sourceId, sourceTitle, page, excerpt]
      properties:
        sourceId: { type: integer }
        sourceTitle: { type: string }
        page: { type: integer }
        excerpt: { type: string }
    Message:
      type: object
      required: [id, role, content, citations, createdAt]
      properties:
        contextId: { type: [string, "null"] }
        sourceId: { type: [integer, "null"] }
        id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        createdAt: { type: string }
    MessageInput:
      type: object
      required: [content, level]
      properties:
        contextId: { type: string, minLength: 16, maxLength: 80, pattern: '^[a-zA-Z0-9-]+$' }
        content: { type: string, minLength: 1, maxLength: 6000 }
        sourceId: { type: [integer, "null"] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
    TutorReply:
      type: object
      required: [message, extractedCount]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        extractedCount: { type: integer }
    StudyItem:
      type: object
      required: [id, kind, title, question, answer, status, citations, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [concept, terminology, flashcard] }
        title: { type: string }
        question: { type: string }
        answer: { type: string }
        status: { type: string, enum: [pending, approved, discarded, merged] }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        createdAt: { type: string }
    ItemUpdate:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [edit, approve, discard, merge] }
        title: { type: string, minLength: 1, maxLength: 300 }
        question: { type: string, minLength: 1, maxLength: 2000 }
        answer: { type: string, minLength: 1, maxLength: 6000 }
        kind: { type: string, enum: [concept, terminology, flashcard] }
        mergeTargetId: { type: integer }
    Notebook:
      type: object
      required: [course, sources, pendingCount, approvedCount, messageCount, privacyNotice, aiReady]
      properties:
        activeCourseId: { type: integer }
        course: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        pendingCount: { type: integer }
        approvedCount: { type: integer }
        messageCount: { type: integer }
        privacyNotice: { type: string }
        aiReady: { type: boolean }
